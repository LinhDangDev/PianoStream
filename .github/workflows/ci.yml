# Phase 1a frozen path; edits require a plan amendment.
# Stub+real compile gate (D3): both binding sets compile from day 1 so
# fake/real drift fails the build instead of hiding until integration.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile all flavor binding sets + run unit tests
        run: |
          ./gradlew \
            :app:assembleGithubStubDebug \
            :app:assembleGithubRealDebug \
            :app:assembleFossStubDebug \
            :app:assembleFossRealDebug \
            :app:testGithubStubDebugUnitTest \
            --stacktrace
