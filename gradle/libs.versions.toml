# PianoStream frozen version catalog — Phase 1a owns this file forever.
# Any version bump or new dependency is a plan amendment, not a phase-local edit.
# quickjs-kt is additionally pinned by SHA-256 in gradle/verification-metadata.xml
# (F14): bumping it requires re-pinning that file too.
[versions]
agp = "9.4.1"
