media3 = "1.11.1"
hilt = "2.60.1"
hilt-navigation = "1.4.0"
room = "2.8.5"
datastore = "1.2.1"
navigation3 = "1.2.0"
nav-compose = "2.10.2"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
